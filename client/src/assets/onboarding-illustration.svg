  />

  <!-- sparkles -->
  <g fill="#0d9488">
    <path d="M84 96 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4 Z" opacity="0.55" />
    <path d="M556 118 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 Z" opacity="0.45" />
    <path d="M104 300 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 Z" opacity="0.5" />
    <path d="M520 260 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4 Z" opacity="0.4" />
  </g>

  <!-- paper airplane + trail -->
