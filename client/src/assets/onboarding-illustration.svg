    <linearGradient id="potGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488" />
      <stop offset="1" stop-color="#05846b" />
    </linearGradient>
  </defs>

  <!-- backdrop blob -->
  <path
    d="M60 250 C10 190 30 90 130 60 C210 36 260 84 330 70 C410 54 460 8 530 40 C600 72 630 160 590 230 C555 292 470 300 400 320 C320 342 250 372 170 350 C100 331 100 300 60 250 Z"
