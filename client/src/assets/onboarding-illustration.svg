    <path d="M574 396 C586 350 606 336 626 332 C604 356 594 378 588 396 Z" fill="#0d9488" />
    <path d="M574 396 C560 358 542 348 522 348 C544 364 552 382 556 396 Z" fill="#0d9488" opacity="0.85" />
