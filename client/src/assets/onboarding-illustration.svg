      <rect x="228" y="146" width="72" height="40" rx="8" fill="#eafaf3" />
      <rect x="238" y="156" width="40" height="4" rx="2" fill="#0d9488" opacity="0.55" />
      <rect x="238" y="166" width="28" height="4" rx="2" fill="#0d9488" opacity="0.35" />
      <rect x="228" y="192" width="72" height="40" rx="8" fill="#eafaf3" />
      <rect x="238" y="202" width="36" height="4" rx="2" fill="#0d9488" opacity="0.55" />
      <rect x="238" y="212" width="24" height="4" rx="2" fill="#0d9488" opacity="0.35" />
