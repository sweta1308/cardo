services:
  - type: web
    name: cardo-api
    runtime: node
    rootDir: server
    plan: free
    # Dev dependencies are needed here: the Prisma CLI runs generate and migrate.
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migrate:deploy
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
